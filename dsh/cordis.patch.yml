# DeepSeek Harness bundle layer.
#
# Installing this package as a dsh bundle appends this layer to the profile:
# one row mounting ./plugin.mjs, which publishes the 25 skills in ./skills
# through the harness skill registry. Removing the bundle removes the row,
# the provider, and every ported skill together.
#
# The row name is a path anchored beside this patch file, so the bundle works
# from wherever it is installed.
- insert:
    - id: agent-skills
      name: './plugin.mjs'
